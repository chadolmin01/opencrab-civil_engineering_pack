type: ChiefSupervisor
version: "1.0"
space: subject
description: 책임감리 / 책임건설사업관리기술인 (Chief construction manager bearing statutory responsibility under 건진법).
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Full name of the chief supervisor (책임감리 본인 이름).
  qualification_level:
    type: string
    required: true
    nullable: false
    description: Construction engineer grade — master (특급) required for chief supervisor role; senior (고급) permitted for projects in the 10–20 billion KRW range under 건진법 시행령 별표 6.
    enum: [senior, master]
    default: master
  affiliated_organization:
    type: string
    required: true
    nullable: false
    description: Affiliated construction management firm (소속 건설사업관리 용역사).
  responsible_sites:
    type: list
    required: true
    nullable: false
    description: List of construction sites under this chief supervisor's responsibility (담당 현장 목록).
  appointment_date:
    type: string
    required: true
    nullable: false
    description: Date of appointment as chief supervisor in ISO 8601 format (지명일).
  legal_responsibility_scope:
    type: string
    required: false
    nullable: true
    description: Short description of statutory responsibility scope under 건진법 (법적 책임 범위).

  # --- faceted classification axes (added) ---
  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]
