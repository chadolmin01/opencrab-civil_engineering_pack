type: CompletionInspectionDecision
version: "1.0"
space: decision
description: 준공검사 결정 — Qualified-actor decision certifying that all contracted construction work has been completed in accordance with drawings, specifications, and regulations, and authorizing project closeout. 근거: 건진법 §55③.
properties:
  decision_id:
    type: string
    required: true
    nullable: false
    description: Unique identifier of the decision record.
  decision_date:
    type: string
    required: true
    nullable: false
    description: Date of the decision (ISO 8601 or yyyy-mm-dd).
  decided_by_ref:
    type: string
    required: true
    nullable: false
    description: Node ID of the qualified actor (subject space) who made the decision.
  legal_basis:
    type: string
    required: false
    nullable: true
    description: Legal/regulatory basis (e.g., `건진법 §55 ③`).
  decision_status:
    type: string
    required: true
    nullable: false
    description: Lifecycle stage of the decision.
    enum: [in_progress, completed, under_review, revoked]
    default: completed
  evidence_refs:
    type: string
    required: false
    nullable: true
    description: Comma-separated node IDs of supporting evidence (resource space).
  notes:
    type: string
    required: false
    nullable: true
    description: Additional remarks.
  contract_completion_date:
    type: string
    required: false
    nullable: true
    description: Contractual completion date (ISO 8601 or yyyy-mm-dd).
  actual_completion_date:
    type: string
    required: true
    nullable: false
    description: Actual date of completion claimed by the contractor (ISO 8601 or yyyy-mm-dd).
  defects_found:
    type: boolean
    required: true
    nullable: false
    description: Whether defects or deficiencies were identified during completion inspection.
  defect_list_ref:
    type: string
    required: false
    nullable: true
    description: Node ID or document reference for the defect list (하자목록).
  defect_rectification_deadline:
    type: string
    required: false
    nullable: true
    description: Deadline for rectifying identified defects (ISO 8601 or yyyy-mm-dd).
  warranty_period_months:
    type: integer
    required: false
    nullable: true
    description: Defect warranty period in months from the completion date (하자담보 기간).
  as_built_drawings_verified:
    type: boolean
    required: false
    nullable: true
    description: Whether as-built drawings have been verified and accepted.
  result:
    type: string
    required: true
    nullable: false
    description: Decision outcome for the completion inspection.
    enum: [passed, passed_with_conditions, failed, reinspection_required]
  hold_point_type:
    type: string
    required: false
    nullable: true
    description: Hold Point는 자격자 입회 필수, Witness Point는 선택, Surveillance Point는 감리원 일상 점검.
    enum: [hold_point, witness_point, surveillance_point]
  reporting_system:
    type: string
    required: false
    nullable: true
    description: 발주처별 전용 보고 시스템 입력.
    enum: [LH_CMS, EX_CMIS, KR_CMIS, KWATER_CMS, FMS_KOSHA, FMS_MOLIT, custom]

  # --- faceted classification axes ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]
