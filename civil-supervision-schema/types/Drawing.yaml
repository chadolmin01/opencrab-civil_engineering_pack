type: Drawing
version: "1.0"
space: resource
description: 도면 — Engineering or construction drawing issued for a civil project.
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Identifier name of the drawing.
  document_id:
    type: string
    required: false
    nullable: true
    description: Unique document identifier.
  issue_date:
    type: string
    required: false
    nullable: true
    description: Date of issue (ISO 8601 or yyyy-mm-dd).
  issuer_ref:
    type: string
    required: false
    nullable: true
    description: Reference to the issuer/signer node ID in the subject space.
  source_doc_ref:
    type: string
    required: false
    nullable: true
    description: Path or URL of the original source document.
  drawing_number:
    type: string
    required: false
    nullable: true
    description: Drawing number assigned in the project numbering scheme.
  scale:
    type: string
    required: false
    nullable: true
    description: Drawing scale expressed as a ratio (e.g., 1:100).
  revision:
    type: string
    required: false
    nullable: true
    description: Revision tag (e.g., Rev.A).
  discipline:
    type: string
    required: false
    nullable: true
    description: Engineering discipline of the drawing.
    enum: [civil, structural, architectural, mep, geotechnical, other]

  # --- faceted classification axes (added) ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]
