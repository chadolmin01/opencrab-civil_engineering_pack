type: DesignChangeApprovalDecision
version: "1.0"
space: decision
description: 설계변경 승인 결정 — Qualified-actor decision approving or rejecting a proposed change to approved construction drawings or specifications. 근거: 건진법 §39, 국계법 시행령 §64.
properties:
  decision_id:
    type: string
    required: true
    nullable: false
    description: Unique identifier of the decision record.
  decision_date:
    type: string
    required: true
    nullable: false
    description: Date of the decision (ISO 8601 or yyyy-mm-dd).
  decided_by_ref:
    type: string
    required: true
    nullable: false
    description: Node ID of the qualified actor (subject space) who made the decision.
  legal_basis:
    type: string
    required: false
    nullable: true
    description: Legal/regulatory basis (e.g., `건진법 §39 ①`, `국계법 시행령 §64`).
  decision_status:
    type: string
    required: true
    nullable: false
    description: Lifecycle stage of the decision.
    enum: [in_progress, completed, under_review, revoked]
    default: completed
  evidence_refs:
    type: string
    required: false
    nullable: true
    description: Comma-separated node IDs of supporting evidence (resource space).
  notes:
    type: string
    required: false
    nullable: true
    description: Additional remarks.
  change_request_number:
    type: string
    required: true
    nullable: false
    description: Unique reference number of the design change request (설계변경 요청번호).
  change_category:
    type: string
    required: true
    nullable: false
    description: |
      설계변경 유형 — Category of the design change.
      quantity_change(물량 변경) / spec_change(규격 변경) /
      scope_addition(범위 추가) / scope_reduction(범위 삭감) / error_correction(설계 오류 정정).
    enum: [quantity_change, spec_change, scope_addition, scope_reduction, error_correction, other]
  cost_impact:
    type: float
    required: false
    nullable: true
    description: Estimated cost impact of the design change in KRW (양수: 증액, 음수: 감액).
  schedule_impact_days:
    type: integer
    required: false
    nullable: true
    description: Estimated schedule impact in calendar days (양수: 공기 연장, 음수: 단축).
  approving_authority:
    type: string
    required: false
    nullable: true
    description: |
      승인 권한자 — Tier of authority required for this change approval.
      site_manager(현장소장 전결) / cm_chief(책임감리원 승인) /
      owner(발주처 승인) / regulatory(관계기관 협의 필요).
    enum: [site_manager, cm_chief, owner, regulatory]
  result:
    type: string
    required: true
    nullable: false
    description: Decision outcome for the design change request.
    enum: [approved, rejected, conditional_approval, deferred]
  hold_point_type:
    type: string
    required: false
    nullable: true
    description: Hold Point는 자격자 입회 필수, Witness Point는 선택, Surveillance Point는 감리원 일상 점검.
    enum: [hold_point, witness_point, surveillance_point]
  reporting_system:
    type: string
    required: false
    nullable: true
    description: 발주처별 전용 보고 시스템 입력.
    enum: [LH_CMS, EX_CMIS, KR_CMIS, KWATER_CMS, FMS_KOSHA, FMS_MOLIT, custom]

  # --- faceted classification axes ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]
