type: ConstructionInspectionDecision
version: "1.0"
space: decision
description: "공종별 시공 검측 결정 — Qualified-actor decision on whether a specific work type or structural component passes construction inspection. 근거: 건진법 §55, 건설공사 감리업무 수행지침."
properties:
  decision_id:
    type: string
    required: true
    nullable: false
    description: Unique identifier of the decision record.
  decision_date:
    type: string
    required: true
    nullable: false
    description: Date of the decision (ISO 8601 or yyyy-mm-dd).
  decided_by_ref:
    type: string
    required: true
    nullable: false
    description: Node ID of the qualified actor (subject space) who made the decision.
  legal_basis:
    type: string
    required: false
    nullable: true
    description: Legal/regulatory basis (e.g., `건진법 §55 ①`).
  decision_status:
    type: string
    required: true
    nullable: false
    description: Lifecycle stage of the decision.
    enum: [in_progress, completed, under_review, revoked]
    default: completed
  evidence_refs:
    type: string
    required: false
    nullable: true
    description: Comma-separated node IDs of supporting evidence (resource space).
  notes:
    type: string
    required: false
    nullable: true
    description: Additional remarks.
  work_type_ref:
    type: string
    required: true
    nullable: false
    description: Node ID of the work type (concept space) being inspected.
  component_ref:
    type: string
    required: false
    nullable: true
    description: Node ID of the structural component (concept space), optional.
  location:
    type: string
    required: false
    nullable: true
    description: On-site location description (e.g., grid B-3, pier P2).
  inspection_method:
    type: string
    required: false
    nullable: true
    description: Description of the inspection method or procedure applied.
  result:
    type: string
    required: true
    nullable: false
    description: |
      검측 결과 — Inspection result. pass(적합) / fail(부적합) / conditional_pass(조건부 적합) /
      corrective_required(시정지시 필요).
    enum: [pass, fail, conditional_pass, corrective_required]
  inspection_workflow:
    type: string
    required: false
    nullable: true
    description: |
      검측 절차 단계 — 4-step inspection workflow stage.
      self_check(시공자 자체점검) → inspection_request(검측요청서 제출) →
      supervisor_inspection(감리 검측) → corrective_directive(시정지시).
    enum: [self_check, inspection_request, supervisor_inspection, corrective_directive]

  hold_point_type:
    type: string
    required: false
    nullable: true
    description: Hold Point는 자격자 입회 필수, Witness Point는 선택, Surveillance Point는 감리원 일상 점검.
    enum: [hold_point, witness_point, surveillance_point]
  reporting_system:
    type: string
    required: false
    nullable: true
    description: 발주처별 전용 보고 시스템 입력.
    enum: [LH_CMS, EX_CMIS, KR_CMIS, KWATER_CMS, FMS_KOSHA, FMS_MOLIT, custom]

  # --- faceted classification axes (added) ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_property:
    type: string
    required: false
    nullable: true
    description: |
      Primary property/dimension addressed (for cross-domain matching).
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [strength, slump, fatigue, durability, stability, safety, dimension, tolerance, deformation, deflection, settlement, vibration, thermal, corrosion, fire, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]

  topic_environment:
    type: string
    required: false
    nullable: true
    description: |
      Environmental condition assumption.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [normal, cold_weather, hot_weather, rainy, windy, snowy, seismic, underwater, underground, marine, other]
