type: ProgressPaymentInspectionDecision
version: "1.0"
space: decision
description: 기성검사 결정 — Qualified-actor decision confirming the progress and workmanship of completed construction work to authorize interim payment. 근거: 국계법 시행령 §55, §57.
properties:
  decision_id:
    type: string
    required: true
    nullable: false
    description: Unique identifier of the decision record.
  decision_date:
    type: string
    required: true
    nullable: false
    description: Date of the decision (ISO 8601 or yyyy-mm-dd).
  decided_by_ref:
    type: string
    required: true
    nullable: false
    description: Node ID of the qualified actor (subject space) who made the decision.
  legal_basis:
    type: string
    required: false
    nullable: true
    description: Legal/regulatory basis (e.g., `국계법 시행령 §55`, `국계법 시행령 §57`).
  decision_status:
    type: string
    required: true
    nullable: false
    description: Lifecycle stage of the decision.
    enum: [in_progress, completed, under_review, revoked]
    default: completed
  evidence_refs:
    type: string
    required: false
    nullable: true
    description: Comma-separated node IDs of supporting evidence (resource space).
  notes:
    type: string
    required: false
    nullable: true
    description: Additional remarks.
  payment_period:
    type: string
    required: true
    nullable: false
    description: Billing period covered by this inspection (e.g., `2025-01`, `2025-Q1`, or `2025-01-01/2025-03-31`).
  claimed_completion_rate:
    type: float
    required: true
    nullable: false
    description: Contractor-claimed completion rate as a percentage (0.0 to 100.0).
  verified_completion_rate:
    type: float
    required: false
    nullable: true
    description: Inspector-verified completion rate as a percentage after field check (0.0 to 100.0).
  claimed_amount_krw:
    type: float
    required: false
    nullable: true
    description: Contractor-claimed interim payment amount in KRW.
  approved_amount_krw:
    type: float
    required: false
    nullable: true
    description: Inspector-approved interim payment amount in KRW after verification.
  inspector_role:
    type: string
    required: false
    nullable: true
    description: |
      검사자 자격 — Role of the qualified actor conducting the inspection.
      owner_inspector(발주처 감독관) / cm_chief(책임감리원) / third_party(제3자 검사기관).
    enum: [owner_inspector, cm_chief, third_party]
  result:
    type: string
    required: true
    nullable: false
    description: Decision outcome for the progress payment inspection.
    enum: [approved, partially_approved, rejected, pending_correction]
  hold_point_type:
    type: string
    required: false
    nullable: true
    description: Hold Point는 자격자 입회 필수, Witness Point는 선택, Surveillance Point는 감리원 일상 점검.
    enum: [hold_point, witness_point, surveillance_point]
  reporting_system:
    type: string
    required: false
    nullable: true
    description: 발주처별 전용 보고 시스템 입력.
    enum: [LH_CMS, EX_CMIS, KR_CMIS, KWATER_CMS, FMS_KOSHA, FMS_MOLIT, custom]

  # --- faceted classification axes ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]
