type: Specification
version: "1.0"
space: resource
description: 시방서 — Technical specification document defining requirements for construction works.
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Identifier name of the specification.
  document_id:
    type: string
    required: false
    nullable: true
    description: Unique document identifier.
  issue_date:
    type: string
    required: false
    nullable: true
    description: Date of issue (ISO 8601 or yyyy-mm-dd).
  issuer_ref:
    type: string
    required: false
    nullable: true
    description: Reference to the issuer/signer node ID in the subject space.
  source_doc_ref:
    type: string
    required: false
    nullable: true
    description: Path or URL of the original source document.
  section:
    type: string
    required: false
    nullable: true
    description: Specification section number.
  applicable_standard_refs:
    type: string
    required: false
    nullable: true
    description: Applicable KDS/KCS standard codes referenced by this specification.
  discipline:
    type: string
    required: false
    nullable: true
    description: Engineering discipline of the specification.
    enum: [civil, structural, architectural, mep, geotechnical, other]

  # --- faceted classification axes (added) ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_property:
    type: string
    required: false
    nullable: true
    description: |
      Primary property/dimension addressed (for cross-domain matching).
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [strength, slump, fatigue, durability, stability, safety, dimension, tolerance, deformation, deflection, settlement, vibration, thermal, corrosion, fire, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]

  topic_environment:
    type: string
    required: false
    nullable: true
    description: |
      Environmental condition assumption.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [normal, cold_weather, hot_weather, rainy, windy, snowy, seismic, underwater, underground, marine, other]
