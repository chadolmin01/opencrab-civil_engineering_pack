type: SupervisionLog
version: "1.0"
space: resource
description: 감리일지 — Daily supervision log written by the supervisor recording inspections and issues.
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Identifier name of the supervision log.
  document_id:
    type: string
    required: false
    nullable: true
    description: Unique document identifier.
  issue_date:
    type: string
    required: false
    nullable: true
    description: Date of issue (ISO 8601 or yyyy-mm-dd).
  issuer_ref:
    type: string
    required: false
    nullable: true
    description: Reference to the issuer/signer node ID in the subject space.
  source_doc_ref:
    type: string
    required: false
    nullable: true
    description: Path or URL of the original source document.
  log_date:
    type: string
    required: true
    nullable: false
    description: Calendar date the log covers (ISO 8601 or yyyy-mm-dd).
  weather:
    type: string
    required: false
    nullable: true
    description: Weather conditions on the log date.
  inspections_performed:
    type: string
    required: false
    nullable: true
    description: Summary of inspections performed on the log date.
  issues_raised:
    type: string
    required: false
    nullable: true
    description: Summary of issues raised or instructions given.
