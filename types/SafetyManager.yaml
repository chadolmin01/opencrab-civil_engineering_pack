type: SafetyManager
version: "1.0"
space: subject
description: 안전관리자 (Occupational safety manager designated under 산업안전보건법 / 산안법).
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Full name of the safety manager (안전관리자 본인 이름).
  qualification_level:
    type: string
    required: true
    nullable: false
    description: Construction engineer grade for safety management (건설기술인 등급).
    enum: [trainee, intermediate, senior, master]
  affiliated_organization:
    type: string
    required: true
    nullable: false
    description: Affiliated employer organization (소속 사업장 또는 시공사).
  safety_management_scope:
    type: string
    required: true
    nullable: false
    description: Scope of safety management duties (관리 범위 — e.g., site-wide, specific facility, specific work types).
  appointment_date:
    type: string
    required: true
    nullable: false
    description: Date of appointment as safety manager in ISO 8601 format (선임일).

  # --- faceted classification axes (added) ---
  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]

  topic_environment:
    type: string
    required: false
    nullable: true
    description: |
      Environmental condition assumption.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [normal, cold_weather, hot_weather, rainy, windy, snowy, seismic, underwater, underground, marine, other]
