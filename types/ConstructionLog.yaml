type: ConstructionLog
version: "1.0"
space: resource
description: 시공일지 — Daily construction log written by the site engineer summarizing on-site activities.
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Identifier name of the construction log.
  document_id:
    type: string
    required: false
    nullable: true
    description: Unique document identifier.
  issue_date:
    type: string
    required: false
    nullable: true
    description: Date of issue (ISO 8601 or yyyy-mm-dd).
  issuer_ref:
    type: string
    required: false
    nullable: true
    description: Reference to the issuer/signer node ID in the subject space.
  source_doc_ref:
    type: string
    required: false
    nullable: true
    description: Path or URL of the original source document.
  log_date:
    type: string
    required: true
    nullable: false
    description: Calendar date the log covers (ISO 8601 or yyyy-mm-dd).
  weather:
    type: string
    required: false
    nullable: true
    description: Weather conditions on the log date.
  work_summary:
    type: string
    required: false
    nullable: true
    description: Narrative summary of work performed on the log date.
  attendees_count:
    type: int
    required: false
    nullable: true
    description: Number of workers present on the log date.
