type: TestReport
version: "1.0"
space: resource
description: 시험성적서 — Laboratory or field test report documenting measured results for a sample.
properties:
  name:
    type: string
    required: true
    nullable: false
    description: Identifier name of the test report.
  document_id:
    type: string
    required: false
    nullable: true
    description: Unique document identifier.
  issue_date:
    type: string
    required: false
    nullable: true
    description: Date of issue (ISO 8601 or yyyy-mm-dd).
  issuer_ref:
    type: string
    required: false
    nullable: true
    description: Reference to the issuer/signer node ID in the subject space.
  source_doc_ref:
    type: string
    required: false
    nullable: true
    description: Path or URL of the original source document.
  test_method:
    type: string
    required: false
    nullable: true
    description: Test method applied (e.g., compressive_strength, slump, tensile, gradation, other).
  sample_id:
    type: string
    required: false
    nullable: true
    description: Identifier of the tested sample.
  test_date:
    type: string
    required: false
    nullable: true
    description: Date the test was performed (ISO 8601 or yyyy-mm-dd).
  test_result:
    type: string
    required: false
    nullable: true
    description: Overall result of the test.
    enum: [pass, fail, conditional]

  # --- faceted classification axes (added) ---
  topic_material:
    type: string
    required: false
    nullable: true
    description: |
      Primary material/medium this entity applies to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [concrete, steel, rebar, aggregate, cement, soil, rock, asphalt, timber, composite, mixed, other]

  topic_property:
    type: string
    required: false
    nullable: true
    description: |
      Primary property/dimension addressed (for cross-domain matching).
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [strength, slump, fatigue, durability, stability, safety, dimension, tolerance, deformation, deflection, settlement, vibration, thermal, corrosion, fire, other]

  topic_phase:
    type: string
    required: false
    nullable: true
    description: |
      Lifecycle phase this entity belongs to.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [planning, design, material_acceptance, construction, inspection, approval, commissioning, maintenance, diagnosis, demolition]

  topic_scope:
    type: string
    required: false
    nullable: true
    description: |
      Scope of application: from material lot up to facility.
      Orthogonal facet — used for cross-domain node matching by the
      OpenCRAB LLM extractor.
    enum: [material, specimen, joint, member, assembly, structure, facility, site, project]
